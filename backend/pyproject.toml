[project]
name = "hollywood-backend"
version = "0.1.0"
description = "Hollywood agentic AI movie-generation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "openai>=1.66,<3",
  "google-genai>=1.0,<4",
  "httpx>=0.28,<1",
  "tenacity>=9.0,<10",
  "python-multipart>=0.0.20,<1",
  "pydub>=0.25,<1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1", "psycopg[binary,pool]>=3.2,<4", "langgraph-checkpoint-postgres>=2.0,<4"]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "respx>=0.22,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
